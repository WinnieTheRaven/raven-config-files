#
# spectrwm Example Configuration File
#
# PLEASE READ THE MAN PAGE BEFORE EDITING THIS FILE!
# https://htmlpreview.github.io/?https://github.com/conformal/spectrwm/blob/master/spectrwm.html
#
# All example settings in this file are commented out with a '#'.
# See the spectrwm(1) man page for default values.
#
# NOTE: rgb color values are in hexadecimal! See XQueryColor(3) for details.

workspace_limit     = 10
focus_mode		= default
focus_close		= previous
focus_close_wrap	= 1
focus_default		= last
spawn_position		= next
workspace_clamp	= 1
warp_focus		= 1
warp_pointer		= 0

# Window Decoration
border_width		= 5
color_focus		= rgb:b9/94/dd
color_focus_maximized	= rgb:b9/94/dd
color_unfocus		= rgb:af/e7/d8
color_unfocus_maximized	= rgb:af/e7/d8
region_padding		= 10
tile_gap		= 10

# Region containment
# Distance window must be dragged/resized beyond the region edge before it is
# allowed outside the region.
boundary_width 		= 20

# Settings that apply when regions have a single window
# '1' - apply only when status bar is disabled.
# 'always' - apply regardless of status bar.
#disable_border	= 1# remove window border

# Bar Settings
#bar_action		= /home/raven/baraction.sh
#bar_action_expand	= 1
bar_enabled		= 0
bar_border_width	= 0
#bar_border[1]		= rgb:b9/94/dd
#bar_border_unfocus[1]	= rgb:b9/94/dd
#bar_color[1]		= rgb:b9/94/dd
#bar_color_selected[1]	= rgb:b9/94/dd
#bar_delay		= 5
#bar_font_color[1]	= rgb:ff/ff/ff
#bar_font_color_selected	= rgb:ff/ff/ff
#bar_font		= Spleen-14:pixelsize=16:antialias=true
#bar_justify		= center
#bar_format		= +N:+I +S (+D) | +A
#workspace_indicator	= listcurrent,listactive,markcurrent,printnames
#bar_at_bottom		= 0
#stack_enabled		= 1
#clock_enabled		= 1
#clock_format		= %a %b %d %R %Z %Y
#iconic_enabled		= 0
#maximize_hide_bar	= 0
#window_class_enabled	= 1
#window_instance_enabled	= 1
#window_name_enabled	= 1
#verbose_layout		= 1
#urgent_enabled		= 1
autorun			= ws[1]:/home/raven/.config/polybar/launch.sh
autorun			= ws[1]:xsettingsd
autorun			= ws[1]:picom -b

# Dialog box size ratio when using TRANSSZ quirk; 0.3 < dialog_ratio <= 1.0
#dialog_ratio		= 0.6

# The pixel amount to move/resize windows via the move_ and shrink/grow actions.
#move_step		= 50
#resize_step		= 50

# Split a non-RandR dual head setup into one region per monitor
# (non-standard driver-based multihead is not seen by spectrwm)
#region			= screen[1]:1280x1024+0+0
#region			= screen[1]:1280x1024+1280+0

# Customize workspace layout at start
#layout			= ws[1]:4:0:0:0:vertical
#layout			= ws[1]:0:0:0:0:horizontal
#layout			= ws[3]:0:0:0:0:max
#layout			= ws[4]:4:0:0:0:vertical_flip
#layout			= ws[5]:0:0:0:0:horizontal_flip
#layout			= ws[6]:0:0:0:0:floating

# Set workspace name at start
#name			= ws[1]:IRC
#name			= ws[2]:Email
#name			= ws[3]:Browse
#name			= ws[10]:Music

# Change the modifier to use when specifying 'MOD' in bindings.
# This should come before configuring bindings, not after.
# (Mod1: Alt key, Mod4: Windows key, Mod2: Apple key on OSX)
modkey = Mod4

# This allows you to include pre-defined key bindings for your keyboard layout.
# All key bindings are cleared before loading bindings in the specified file.
#keyboard_mapping	= ~/.spectrwm.conf

# PROGRAMS

# Set the default spawn flags for 'autorun' and 'program' entries.
# Note that this does not affect existing entries, including defaults.
#spawn_flags		= nospawnws

# A regex search pattern can be specified to change existing entries:
#spawn_flags[menu|term]	+= nospawnws

# Change spawn flags on all existing entries, including defaults:
#spawn_flags[.*]	+= nospawnws

# Launch applications in a workspace of choice.
# Note that the specified workspace is ignored when 'nospawnws' is set.
#autorun		= ws[1]:xterm
#autorun		= ws[2]:xombrero http://www.openbsd.org

# Validated default program entries:
#program[lock]		= xlock
#program[menu]		= dmenu_run $dmenu_bottom -fn $bar_font -nb $bar_color -nf $bar_font_color -sb $bar_color_selected -sf $bar_font_color_selected
#program[search]		= dmenu $dmenu_bottom -i -fn $bar_font -nb $bar_color -nf $bar_font_color -sb $bar_color_selected -sf $bar_font_color_selected
#program[name_workspace]	= dmenu $dmenu_bottom -p Workspace -fn $bar_font -nb $bar_color -nf $bar_font_color -sb $bar_color_selected -sf $bar_font_color_selected

# Validation of the above can be disabled by setting the 'optional' spawn flag.
# Note that these entries are required for included features. Instead of
# disabling validation, it is recommended to resolve these dependencies or
# override the entries with suitable alternatives.
#spawn_flags[lock|term|menu|search|name_workspace]	+= optional

# These are my bindings UwUr. I don want collisions with emacs strokes UwUr <3
bind[wind_del] = Mod4+q
bind[restarT] = Mod4+Shift+r
bind[wind_kill] = Mod4+Shift+q
bind[height_grow] = Mod4+Shift+plus
bind[width_grow] = Mod4+plus
bind[height_shrink] = Mod4+Shift+minus
bind[width_shrink] = Mod4+minus
bind[fullscreen_toggle] = Mod4+Shift+e
bind[maximize_toggle] = Mod4+e
bind[focus_next] = Mod4+j
bind[focus_prev] = Mod4+k
bind[float_toggle] = Mod4+t
bind[cycle_layout] = Mod4+space
bind[move_left] = MOD+Left
bind[move_right] = MOD+Right
bind[move_up] = MOD+Up
bind[move_down] = MOD+Down
# Default programs with the 'optional' spawn flag:
#program[screenshot_all]	= screenshot.sh full
#program[screenshot_wind]	= screenshot.sh window
#program[initscr]	= initscreen.sh
program[alacritty_term]	= alacritty
bind[alacritty_term]	= MOD+Shift+Return
program[xterm]		= xterm
bind[xterm]	    = Mod4+Shift+t
program[emacs]      = emacs
program[badwolf]    = badwolf
bind[badwolf]	    = MOD+b
bind[emacs]         = MOD+Shift+w
program[firefox]    = firefox
bind[firefox]	    = MOD+Shift+b
program[retroarch]  = retroarch
bind[retroarch]	    = MOD+g
program[okular]	    = okular
bind[okular]	    = MOD+v
program[dolphin]    = dolphin
bind[dolphin]	    = MOD+f
program[i3lock]	    = betterlockscreen -l normal
bind[i3lock]	    = MOD+l
program[xemu]	    = flatpak run app.xemu.xemu
bind[xemu]	    = MOD+x
program[rofi]	    = rofi -show drun -theme ~/.config/rofi/config.rasi
bind[rofi]	    = MOD+m
program[screenshot_full]	= maim /home/raven/Pictures/screenshot_%Y-%m-%d_%H-%M-%S.png
bind[screenshot_full]		= MOD+s
program[screenshot_select]	= maim -s /home/raven/Pictures/screenshot_%Y-%m-%d_%H-%M-%S.png
bind[screenshot_select]		= MOD+Shift+s
program[pcsx2-qt]		= flatpak run net.pcsx2.PCSX2
bind[pcsx2-qt]			= MOD+Shift+g
program[vol_up]			= wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.5
bind[vol_up]			= XF86AudioRaiseVolume
program[vol_down]		= wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind[vol_down]			= XF86AudioLowerVolume
program[vol_mute]		= wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind[vol_mute]			= XF86AudioMute
# QUIRKS
# Default quirks, remove with: quirk[class:name] = NONE
quirk[xemu:xemu] = FLOAT + ANYWHERE
#quirk[.*:.*:.*:splash,dialog]		= FLOAT
#quirk[.*:.*:.*:toolbar,utility]		= FLOAT + ANYWHERE
#quirk[.*:.*:.*:notification]		= FLOAT + ANYWHERE + MINIMALBORDER + NOFOCUSONMAP
#quirk[MPlayer:xv]			= FLOAT + FULLSCREEN + FOCUSPREV
#quirk[OpenOffice.org 2.4:VCLSalFrame]	= FLOAT
#quirk[OpenOffice.org 3.0:VCLSalFrame]	= FLOAT
#quirk[OpenOffice.org 3.1:VCLSalFrame]	= FLOAT
#quirk[Firefox-bin:firefox-bin]		= TRANSSZ
#quirk[Firefox:Dialog]			= FLOAT
#quirk[Gimp:gimp]			= FLOAT + ANYWHERE
#quirk[XTerm:xterm]			= XTERM_FONTADJ
#quirk[xine:Xine Window]			= FLOAT + ANYWHERE
#quirk[Xitk:Xitk Combo]			= FLOAT + ANYWHERE
#quirk[xine:xine Panel]			= FLOAT + ANYWHERE
#quirk[Xitk:Xine Window]			= FLOAT + ANYWHERE
#quirk[xine:xine Video Fullscreen Window]	= FULLSCREEN + FLOAT
#quirk[pcb:pcb]				= FLOAT